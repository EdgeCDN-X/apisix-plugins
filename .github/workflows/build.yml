name: Build and push APISIX image

on:
  push:
    branches:
      - main
    tags:
      - '**'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: image
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          base_image=$(awk 'toupper($1) == "FROM" { print $2; exit }' Dockerfile)
          if [[ "$base_image" != apache/apisix:* ]]; then
            echo "Expected a tagged apache/apisix base image in Dockerfile" >&2
            exit 1
          fi
          tag="${base_image#apache/apisix:}-$REF_NAME"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ || ${#tag} -gt 128 ]]; then
            echo "Invalid Docker image tag: $tag" >&2
            exit 1
          fi
          echo "tag=fr6nco/apisix:$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/wasm/query-param-filter/go.mod
          cache: false

      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: '0.40.1'

      - name: Build WASM plugins
        run: make

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=fr6nco/apisix,push-by-digest=true,name-canonical=true,push=true

      - name: Save image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $DIGEST" >&2
            exit 1
          fi
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest-$ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish multi-architecture image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          read -r amd64 < "$RUNNER_TEMP/digests/digest-amd64"
          read -r arm64 < "$RUNNER_TEMP/digests/digest-arm64"
          docker buildx imagetools create \
            --tag "$IMAGE_TAG" \
            "fr6nco/apisix@$amd64" \
            "fr6nco/apisix@$arm64"
